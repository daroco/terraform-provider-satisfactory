openapi: "3.0.3"
info:
  title: SatisfactoTerraform Mod API
  description: >
    REST API exposed by the SatisfactoTerraform SML mod from inside a running
    Satisfactory session (host or dedicated server). The Terraform provider is
    the only intended client. All write operations are queued to the game
    thread and the response is returned once the change has been applied to
    the world.
  version: 0.1.0
servers:
  - url: http://localhost:8090/api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Mod is loaded and the HTTP listener is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /world:
    get:
      summary: Session metadata
      responses:
        "200":
          description: Current session info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_name: { type: string }
                  game_version: { type: string }
                  mod_version: { type: string }
  /world/buildables:
    get:
      summary: Everything near a point, whether Terraform placed it or not
      description: >
        Read-only enumeration used by export/blueprint tooling. Unlike
        /buildables (which lists only what this mod placed and tracks by
        tf_id), this reports the world as it actually is, so a factory built
        by hand can be turned into configuration.


        The spatial filter is required rather than optional: a mature save
        holds tens of thousands of buildables and returning all of them is
        unusable. Entries the mod already tracks carry their tf_id; entries
        without one were built in-game.
      parameters:
        - name: x
          in: query
          required: true
          schema: { type: number }
          description: Centre of the search sphere, in centimetres.
        - name: y
          in: query
          required: true
          schema: { type: number }
        - name: z
          in: query
          required: true
          schema: { type: number }
        - name: radius
          in: query
          required: true
          schema: { type: number, minimum: 0, maximum: 100000 }
          description: Search radius in centimetres (max 100000, i.e. 1 km).
      responses:
        "200":
          description: Buildables within the radius.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorldBuildable" }
        "422": { $ref: "#/components/responses/Invalid" }
  /world/resource-nodes:
    get:
      summary: Resource nodes, geysers and water volumes an extractor can bind to
      description: >
        Read-only. Miners, water extractors and the like are not placed at a
        coordinate; they are placed ON a world feature, so a config has to be
        able to find one first. Each entry's id is the stable actor path of the
        feature, which is what POST /buildables takes as node_id.


        Only features currently loaded by the engine are reported. On a large
        map with streaming that can exclude distant nodes, so callers that
        need a specific far-away node should query from near it. When x/y/z
        are given the result is sorted by ascending distance from that point
        (ties broken by id); otherwise by id. That ordering is part of the
        contract - a config that picks "the nearest free iron node" relies on
        it being stable between plans.
      parameters:
        - name: resource
          in: query
          required: false
          schema: { type: string }
          description: Resource descriptor class to keep, e.g. Desc_OreIron_C or Desc_Water_C. Omit for all.
        - name: purity
          in: query
          required: false
          schema: { type: string, enum: [impure, normal, pure] }
          description: Keep only nodes of this purity. Water volumes have no purity and never match a purity filter.
        - name: x
          in: query
          required: false
          schema: { type: number }
          description: Centre to sort/filter by, in centimetres. x, y and z go together.
        - name: y
          in: query
          required: false
          schema: { type: number }
        - name: z
          in: query
          required: false
          schema: { type: number }
        - name: radius
          in: query
          required: false
          schema: { type: number, minimum: 0 }
          description: Keep only features within this many centimetres of x/y/z. Requires x, y and z.
        - name: include_occupied
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: >
            Also report features that already have an extractor on them. A
            config that wants stable node selection across plans should set
            this and filter on occupant_tf_id instead, so the nodes it already
            owns keep their place in the ordering.
      responses:
        "200":
          description: Matching features.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResourceNode" }
        "422": { $ref: "#/components/responses/Invalid" }
  /players:
    get:
      summary: Where the players are standing
      description: >
        Lets export tooling anchor output to a player's position rather than
        to absolute world coordinates.
      responses:
        "200":
          description: Connected players that have spawned in.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Player" }
  /session/save:
    post:
      summary: Save the running session
      description: >
        Writes a save file through the game's own save system and answers
        when the write has finished, so a caller can quit or reload right
        after. With no name, the save is called "<session name>_terraform".
        Only one save can be in flight at a time.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionSave" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSaveResult" }
        "409":
          description: A save is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The game reported the save failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /session/quit:
    post:
      summary: Save (by default) and exit the game process
      description: >
        Saves exactly like POST /session/save unless `save` is false, answers,
        and then asks the engine to exit. With the mod's auto-load (launch the
        game with `-STFLoad=<save name>` or the environment variable
        `SATISFACTORY_TERRAFORM_LOAD`), this gives tooling a hands-free
        save, quit, relaunch, reload loop.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionQuit" }
      responses:
        "202":
          description: Saved (if requested); the process exits right after this answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSaveResult" }
        "409":
          description: A save is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The save failed; the game keeps running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /players/{name}/inventory:
    post:
      summary: Put items into a player's inventory
      description: >
        Adds a number of an item (an item descriptor class such as
        Desc_Coal_C) to the named player's inventory, split into full stacks.
        Nothing is checked against unlocks or cost - this API is creative
        mode by design. Answers how many were added, which is fewer than
        asked when the inventory fills up.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The player name GET /players reports.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryGrant" }
      responses:
        "200":
          description: Items added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryGrantResult" }
        "404":
          description: No such player.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The player has no character in the world, or the inventory is full.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Unknown item class or invalid count.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /classes:
    get:
      summary: Every buildable class the game ships, classified by how it must be placed
      description: >
        Read from the asset registry and each class's default object; nothing
        is spawned. The first call loads every buildable class and takes the
        mod a few seconds; the result is cached for the session.


        This is how "Terraform can place everything" is measured rather than
        asserted. Each entry names the resource that places it, or the
        mechanism it is waiting on - node binding, spline routing, rail
        attachment - so the gaps aggregate into a handful of problems.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassInfo" }
  /classes/{class}:
    get:
      summary: Static, spawn-free facts about a buildable class
      description: >
        Reads the class default object, so nothing is placed in the world and
        no save is touched. Useful for deciding how much room a buildable needs
        before laying out a factory - the provider's grid module otherwise has
        no notion of footprint and callers must guess spacing.
      parameters:
        - name: class
          in: path
          required: true
          schema: { type: string }
          description: Buildable class name, e.g. Build_Foundation_8x1_01_C.
      responses:
        "200":
          description: Class metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildableClass" }
        "404": { $ref: "#/components/responses/NotFound" }

  /buildables:
    get:
      summary: List all Terraform-managed buildables
      responses:
        "200":
          description: All buildables tagged with a tf_id.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Buildable" }
    post:
      summary: Spawn a buildable (machine, foundation or extractor)
      description: >
        Two placement modes, chosen by the class. A coordinate-placed class
        (everything that is not a resource extractor) requires `transform`
        and must not carry `node_id`. An extractor class (miners, water
        extractors, oil extractors - anything deriving from
        AFGBuildableResourceExtractorBase) requires `node_id` and is placed
        where the node says it goes: `transform` is ignored on input and the
        response carries the transform it actually got. `placement` lets an
        extractor override yaw, and for a water volume - which is an area, not
        a point - says where on the surface to put it.


        Mixing the modes is a 422 either way: an extractor without node_id
        would stand on nothing and never produce, and a constructor with a
        node_id is a config error worth surfacing. Binding to a node that
        already has an extractor is a 409, mirroring the game, which allows
        one extractor per node.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Buildable" }
      responses:
        "201":
          description: Spawned in the world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buildable" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /buildables/{tf_id}:
    parameters:
      - { name: tf_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read one buildable
      responses:
        "200":
          description: Current state as read from the world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buildable" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update recipe and/or clock speed in place
      description: >
        Only recipe and clock_speed are mutable; anything else requires
        replace. `clock_speed` is accepted on any buildable whose class can
        change potential - manufacturers, extractors and generators. `recipe`
        is accepted on manufacturers only. A buildable with neither (a
        splitter, a foundation) gets a 422 for any patch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipe: { type: string }
                clock_speed: { type: number }
      responses:
        "200":
          description: Updated buildable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buildable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Dismantle the buildable
      responses:
        "204": { description: Dismantled. }
        "404": { $ref: "#/components/responses/NotFound" }
  /connections:
    get:
      summary: List all Terraform-managed connections (belts and power lines)
      responses:
        "200":
          description: All connections tagged with a tf_id.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
    post:
      summary: Create a belt or power line between two buildables
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Connection" }
      responses:
        "201":
          description: Built in the world.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /connections/{tf_id}:
    parameters:
      - { name: tf_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Read one connection
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Dismantle the connection
      responses:
        "204": { description: Dismantled. }
        "404": { $ref: "#/components/responses/NotFound" }
  /preview:
    get:
      summary: Holograms currently standing from previous previews
      responses:
        "200":
          description: Active previews, expired ones already removed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PreviewResult" }
    post:
      summary: Show a would-be buildable as an in-game hologram and validate its placement
      description: >
        Spawns the game's own hologram for the class at the requested
        placement - the same ghost the build gun shows - and leaves it
        standing for ttl_seconds. Nothing is built and nothing is saved:
        holograms are transient actors. The provider calls this during plan
        (when previewing is enabled) so the whole pending change is visible in
        the world before apply, and so the hologram's placement validation
        becomes plan output.


        The hologram runs the game's placement rules (clearance, overlap,
        floor contact, node snapping for extractors) that POST /buildables
        deliberately bypasses. `valid=false` therefore means "the build gun
        would refuse this", not "the API will refuse this" - it is advisory.
        A preview keyed by the same tf_id replaces the previous one. POST
        /buildables with a matching tf_id removes the hologram first, so an
        apply replaces each ghost with its real building.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preview" }
      responses:
        "200":
          description: Hologram placed (or replaced) and validated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewResult" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      summary: Remove every standing preview hologram
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, description: How many holograms were standing. }
  /preview/{tf_id}:
    parameters:
      - { name: tf_id, in: path, required: true, schema: { type: string } }
    get:
      summary: Re-validate one standing preview hologram
      description: >
        A hologram only runs its placement check when asked, and right after
        spawning the answer is "FGCDInitializing" until it has ticked. The
        POST response can therefore be provisional; this read, a tick or more
        later, re-runs the check and is the settled verdict. The provider
        calls it when a POST came back initializing.
      responses:
        "200":
          description: The hologram, re-validated now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewResult" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove one preview hologram
      description: Idempotent - removing a preview that already expired is a 204 too.
      responses:
        "204": { description: Removed, or was not standing. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    NotFound:
      description: No object with that tf_id (demolished in-game or never created).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >
        The request conflicts with existing world state. Either an object with
        that tf_id already exists, or - for POST /buildables of a
        lightweight-eligible class such as a foundation - a buildable of the
        same class already occupies that position. Co-located instances of one
        class cannot be told apart after a save/reload (identity there is class
        plus location), so they are refused rather than created; the world is
        left unchanged.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: >
        Unknown class/recipe, bad transform, invalid connector reference, or a
        recipe the target machine cannot produce (e.g. a constructor recipe on
        a smelter). That last case is rejected here because the game does not:
        it accepts the pairing, reports it back, and shows it in the machine
        UI, so the only visible symptom is a factory that silently never
        produces. Recipes whose producers cannot be determined are allowed
        through - a wrong rejection breaks a legitimate apply, a wrong
        acceptance only yields an idle machine.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ClassInfo:
      type: object
      required: [class, display_name, mechanism, supported]
      properties:
        class: { type: string }
        display_name: { type: string }
        mechanism:
          type: string
          description: >
            foundation, building, belt, power_line, pipeline, hypertube and
            node_bound (extractors, placed via satisfactory_extractor) for
            supported classes; spline, rail_track, rail for the rest. Not a
            closed set - the mod may add mechanisms.
        supported: { type: boolean }
        resource:
          type: string
          description: Terraform resource type that places this class. Absent when unsupported.
        why_unsupported:
          type: string
          description: What the mechanism needs, for classes with no resource.
        settings_not_modelled:
          type: string
          description: >
            State the contract cannot express for a class it can place -
            Terraform can put it down but not configure it.
    BuildableClass:
      type: object
      required: [class, clearance]
      properties:
        class:
          type: string
        clearance:
          type: array
          description: >
            The class's clearance boxes, already transformed by their relative
            transforms, in centimetres relative to the buildable's origin. Empty
            for classes that declare no clearance (common - many buildables do
            not reserve space).
          items: { $ref: "#/components/schemas/ClearanceBox" }
        bounds:
          allOf: [{ $ref: "#/components/schemas/Bounds" }]
          description: >
            Union of every clearance box, i.e. the whole footprint. Omitted when
            clearance is empty. This is the field to use for spacing decisions.
    ClearanceBox:
      type: object
      required: [type, min, max]
      properties:
        type:
          type: string
          enum: [default, soft, block_everything]
          description: >
            default blocks other default boxes; soft may overlap but warns in
            vanilla placement; block_everything refuses even soft overlaps.
        min: { $ref: "#/components/schemas/Vec3" }
        max: { $ref: "#/components/schemas/Vec3" }
    Bounds:
      type: object
      required: [min, max, size]
      properties:
        min: { $ref: "#/components/schemas/Vec3" }
        max: { $ref: "#/components/schemas/Vec3" }
        size:
          allOf: [{ $ref: "#/components/schemas/Vec3" }]
          description: max - min, provided so callers do not repeat the arithmetic.
    Vec3:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Transform:
      type: object
      required: [x, y, z]
      description: World position in centimetres (Unreal units) and yaw in degrees.
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
        yaw: { type: number, default: 0 }
    Buildable:
      type: object
      required: [tf_id, class]
      description: >
        `transform` is required on input for every class except extractors,
        and always present on output. `node_id` is required on input for
        extractor classes and forbidden for the rest.
      properties:
        tf_id:
          type: string
          description: Terraform-assigned stable ID; persisted in the save game.
        class:
          type: string
          description: Game buildable class name, e.g. Build_ConstructorMk1_C or Build_Foundation_8x4_01_C.
        transform: { $ref: "#/components/schemas/Transform" }
        node_id:
          type: string
          description: >
            For extractor classes only: id of the resource node, geyser or
            water volume to bind to, as reported by GET /world/resource-nodes.
            Persisted by the game (the extractor remembers its node across
            save/load), and reported back on every read.
        placement:
          allOf: [{ $ref: "#/components/schemas/Placement" }]
          description: Optional overrides for node-bound placement. Ignored for coordinate-placed classes.
        recipe:
          type: string
          description: >
            Recipe class name for production machines, e.g. Recipe_IronPlate_C.
            Only present on manufacturer buildables (constructors, smelters,
            assemblers, ...); omitted from every response for other classes,
            and silently ignored if supplied when spawning one.
        clock_speed:
          type: number
          description: >
            Clock speed as a fraction (1.0 = 100%). Present on every buildable
            whose class can change potential - manufacturers, extractors and
            generators - where it defaults to 1.0 on create; omitted from every
            response for other classes (there is no universal default - a
            splitter simply has no clock).
    Placement:
      type: object
      description: >
        Where on a world feature to put an extractor. For a resource node the
        position is fixed by the node and only yaw applies. For a water
        volume, which is an area, x/y pick the point on the surface (must lie
        within the volume's bounds; z is the surface); omitted, the volume's
        centre is used.
      properties:
        x: { type: number }
        y: { type: number }
        yaw:
          type: number
          description: Rotation override in degrees. Omitted, the feature's own placement rotation is used.
    ResourceNode:
      type: object
      required: [id, resource, form, type, occupied, x, y, z, yaw]
      properties:
        id:
          type: string
          description: Stable actor path of the feature; what POST /buildables takes as node_id.
        resource:
          type: string
          description: Resource descriptor class, e.g. Desc_OreIron_C, Desc_Coal_C, Desc_Water_C.
        purity:
          type: string
          enum: [impure, normal, pure, ""]
          description: Node purity. Empty for water volumes and anything else without one.
        form:
          type: string
          enum: [solid, liquid, gas, heat]
          description: Resource form; what decides which extractor classes can bind.
        type:
          type: string
          enum: [node, geyser, water, fracking, fracking_satellite]
          description: Kind of feature. Not a closed set.
        occupied:
          type: boolean
          description: True when an extractor already sits on it (built by hand or by Terraform).
        occupant_tf_id:
          type: string
          description: >
            Present when the occupying extractor is one the mod tracks. A
            config can use it to keep selecting nodes it already owns.
        x: { type: number }
        y: { type: number }
        z:
          type: number
          description: Feature position in centimetres. For water, the volume's centre at surface height.
        yaw:
          type: number
          description: The rotation an extractor gets by default when placed here.
        bounds_min:
          allOf: [{ $ref: "#/components/schemas/Vec3" }]
          description: Water volumes only - the axis-aligned box the volume occupies.
        bounds_max:
          allOf: [{ $ref: "#/components/schemas/Vec3" }]
    Preview:
      type: object
      required: [tf_id, class]
      description: >
        Same placement fields as Buildable (transform for coordinate-placed
        classes, node_id and placement for extractors), plus how long the
        hologram should stand.
      properties:
        tf_id:
          type: string
          description: >
            Key for this hologram. Need not be a real tf_id - the provider
            uses a plan-local key when the resource does not exist yet - but
            when it matches a later POST /buildables, that spawn removes the
            hologram first.
        class: { type: string }
        transform: { $ref: "#/components/schemas/Transform" }
        node_id: { type: string }
        placement: { $ref: "#/components/schemas/Placement" }
        ttl_seconds:
          type: integer
          default: 120
          minimum: 1
          maximum: 600
    PreviewResult:
      type: object
      required: [tf_id, class, valid, disqualifiers, x, y, z, yaw]
      properties:
        tf_id: { type: string }
        class: { type: string }
        valid:
          type: boolean
          nullable: true
          description: >
            Whether the game's hologram reports the placement as
            constructible. Null when the mod could not run the hologram's
            validation for this class (see disqualifiers), which is not an
            error - the preview is best-effort.
        disqualifiers:
          type: array
          items: { type: string }
          description: >
            The game's construct-disqualifier class names (e.g.
            CD_Overlap_C, CD_NeedsResourceNode_C) when valid is false, or
            `preview_unavailable` when valid is null. Empty when valid.
        x: { type: number }
        y: { type: number }
        z: { type: number }
        yaw:
          type: number
          description: Where the hologram actually settled after the game's snapping - may differ from what was asked.
        expires_in:
          type: integer
          description: Seconds until the hologram is removed.
    WorldBuildable:
      type: object
      required: [index, class, transform, lightweight]
      properties:
        index:
          type: integer
          description: >
            Position in this response, and the only way to refer to an
            untracked buildable - it has no tf_id. Stable only within a single
            response; do not persist it.
        tf_id:
          type: string
          description: >
            Present only when this buildable is one the mod placed and still
            tracks. Absent means it was built in-game, so exporting it would
            create a second one rather than adopt it.
        class: { type: string }
        transform: { $ref: "#/components/schemas/Transform" }
        node_id:
          type: string
          description: For extractors, the feature they are bound to (see ResourceNode.id).
        lightweight:
          type: boolean
          description: >
            True for buildables the game stores as lightweight instances
            rather than actors (foundations, walls, ramps, ...). Informational:
            it explains why such entries carry no runtime state, and they are
            reported here precisely because they are invisible to actor-based
            enumeration.
        recipe: { type: string }
        clock_speed: { type: number }
        connects:
          $ref: "#/components/schemas/WorldConnection"
    WorldConnection:
      type: object
      required: [from, to]
      description: >
        For a belt or wire, the two buildables it joins. Present only when both
        ends are inside the queried radius and both connector indices could be
        determined - a partially known connection is omitted rather than
        guessed, because a wrong connector index produces configuration that
        applies cleanly and wires the wrong port.
      properties:
        from: { $ref: "#/components/schemas/WorldEndpoint" }
        to: { $ref: "#/components/schemas/WorldEndpoint" }
    WorldEndpoint:
      type: object
      required: [index, connector]
      properties:
        index:
          type: integer
          description: Index of the buildable in this same response.
        connector:
          type: integer
          description: >
            Connector index on that buildable, in the same ordering
            POST /connections accepts - so an exported connection can be
            re-created against the same port.
    SessionSave:
      type: object
      properties:
        name:
          type: string
          description: Save file name without extension. Default "<session name>_terraform".
    SessionSaveResult:
      type: object
      required: [saved]
      properties:
        saved:
          type: string
          description: The save name written; empty when the quit skipped saving.
    SessionQuit:
      type: object
      properties:
        save:
          type: boolean
          default: true
          description: Save before exiting.
        name:
          type: string
          description: Save file name without extension. Default "<session name>_terraform".
    InventoryGrant:
      type: object
      required: [item]
      properties:
        item:
          type: string
          description: Item descriptor class, e.g. Desc_Coal_C.
        count:
          type: integer
          default: 1
          minimum: 1
          maximum: 100000
    InventoryGrantResult:
      type: object
      required: [player, item, requested, added]
      properties:
        player: { type: string }
        item: { type: string }
        requested: { type: integer }
        added:
          type: integer
          description: How many actually went in; less than requested when the inventory is full.
    Player:
      type: object
      required: [location]
      properties:
        name: { type: string }
        location: { $ref: "#/components/schemas/Vec3" }
        yaw: { type: number }
    ConnectionEndpoint:
      type: object
      required: [buildable_tf_id, connector]
      properties:
        buildable_tf_id:
          type: string
          description: tf_id of the buildable this end attaches to.
        connector:
          type: integer
          description: Zero-based index into the buildable's connection components (factory connectors for belts, power connectors for wires).
    Connection:
      type: object
      required: [tf_id, class, from, to]
      properties:
        tf_id: { type: string }
        class:
          type: string
          description: >
            The buildable class to place between the two endpoints, e.g.
            Build_ConveyorBeltMk1_C, Build_PowerLine_C, Build_Pipeline_C or
            Build_PipeHyper_C. The class determines which kind of connector
            each end must be (factory, power, pipe or hypertube); connector
            indices are per-kind, so index 0 of a machine's power connectors
            is unrelated to index 0 of its fluid connectors.
        from: { $ref: "#/components/schemas/ConnectionEndpoint" }
        to: { $ref: "#/components/schemas/ConnectionEndpoint" }
