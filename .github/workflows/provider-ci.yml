name: provider-ci

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  # No paths-ignore here on purpose. `test` is a required status check, and a
  # required check that is skipped never reports - it stays pending forever and
  # the PR cannot merge. A docs-only PR running the Go tests costs about a
  # minute; a permanently stuck PR costs far more.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean; run 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Unit tests
        run: go test ./internal/mockserver/ ./internal/client/... ./internal/api/...

      - name: Acceptance tests (against mockserver)
        run: go test ./internal/provider/ -v -timeout 10m
        env:
          TF_ACC: "1"

      - name: Example applies against mockserver
        run: |
          go build -o /tmp/terraform-provider-satisfactory .
          go build -o /tmp/mockserver ./cmd/mockserver
          /tmp/mockserver -addr :8090 &
          MOCK_PID=$!
          trap "kill $MOCK_PID" EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8090/api/v1/health && break
            [ "$i" = 30 ] && { echo "mockserver never became healthy"; exit 1; }
            sleep 1
          done
          cat > /tmp/dev.tfrc <<EOF
          provider_installation {
            dev_overrides {
              "daroco/satisfactory" = "/tmp"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE=/tmp/dev.tfrc
          for dir in examples/*/; do
            # Only the self-contained, runnable examples have a main.tf. The
            # tfplugindocs example fragments (examples/provider,
            # examples/resources/*) are single-resource snippets for docs and
            # are not applyable on their own - skip them here.
            [ -f "$dir/main.tf" ] || continue
            echo "--- $dir ---"
            # `terraform get` installs local `module` blocks (e.g.
            # factory-floor's grid-2d) without touching providers/backend -
            # full `terraform init` actively breaks under dev_overrides (it
            # queries the registry for daroco/satisfactory, which doesn't
            # exist there, and errors).
            ( cd "$dir" \
              && terraform get \
              && terraform apply -auto-approve \
              && terraform plan -detailed-exitcode \
              && terraform destroy -auto-approve )
          done
